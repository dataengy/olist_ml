[project]
name = "olist_ml"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.23",
    "dagster-dbt==0.29.23",
    "dbt-duckdb==1.11.0",
    "duckdb>=1.4",
    "python-dotenv>=1.2,<2",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "olist_ml"
registry_modules = [
    "olist_ml.components.*",
]

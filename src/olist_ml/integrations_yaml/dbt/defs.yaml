# dbt-проект подключается современным Dagster Component.
type: dagster_dbt.DbtProjectComponent

attributes:
  project:
    project_dir: "{{ project_root }}/dbt"
    profiles_dir: "{{ project_root }}/dbt"
    target_path: "{{ project_root }}/dbt/target"
  cli_args: [build]
  translation:
    key: "{{ node.name }}"
    group_name: "{{ 'sources' if node.resource_type == 'source' else ('seeds' if node.resource_type == 'seed' else (node.fqn[1] if node.fqn | length > 2 else 'dbt')) }}"
    description: "{{ node.description or 'dbt-модель ' ~ node.name }}"
  translation_settings:
    enable_code_references: false
  prepare_if_dev: true

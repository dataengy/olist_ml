# pre-commit: `uv run pre-commit install --hook-type pre-commit --hook-type pre-push`
# Все инструменты — через `uv run`: версии ruff/black/ty/pytest/dbt берутся из uv.lock,
# те же, что в CI (.github/workflows/ci.yml). Ручной прогон: `uv run pre-commit run -a`.
#
#   pre-commit (быстро, на каждый коммит): гигиена файлов, ruff, black, ty
#   pre-push   (десятки секунд):          dbt parse, dg check defs, pytest smoke+unit
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^(dbt/dbt_packages|dbt/target|\.archive|\.claude)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.csv$
      - id: end-of-file-fixer
        exclude: \.csv$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # CSV — в git-lfs (.gitattributes), в самом git только указатели.
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # Линтер + сортировка импортов; COM812 дописывает висячие запятые.
      - id: ruff
        name: ruff (lint --fix)
        entry: uv run ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types: [python]
        require_serial: true

      # Формат: строки ≤ 77, аргументы по одному на строку (magic trailing comma).
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        require_serial: true

      # Типы — по всему проекту (конфиг [tool.ty] в pyproject.toml).
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]

      # dbt: проект парсится (ref/source, yml-схемы, python-модели).
      - id: dbt-parse
        name: dbt parse
        entry: scripts/dbt.sh parse --quiet
        language: system
        pass_filenames: false
        files: ^dbt/
        stages: [pre-push]

      # Dagster: определения (dbt-компонент + ML) грузятся.
      - id: dg-check-defs
        name: dg check defs
        entry: uv run dg check defs
        language: system
        pass_filenames: false
        files: ^(src|dbt)/
        stages: [pre-push]

      - id: pytest-fast
        name: pytest (smoke + unit)
        entry: uv run pytest -m "smoke or unit"
        language: system
        pass_filenames: false
        files: ^(src|dbt|tests)/
        stages: [pre-push]

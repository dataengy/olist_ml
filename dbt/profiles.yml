# Отличие от канона (ADR-04): только таргет duck. ClickHouse-таргет `ch` — в каноническом проекте.
# Закоммичен намеренно: его читают CI и DbtCliResource; секретов нет.
#
# В корневом .env DUCKDB_PATH задаётся относительно корня проекта. Dagster загружает его
# через src/olist_ml/settings.py и передаёт dbt абсолютный путь. Для ручного CLI сначала
# экспортируйте переменные из корневого .env.

olist_dbt:
  target: "{{ env_var('DBT_TARGET', 'duck') }}"
  outputs:
    duck:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/olist.duckdb') }}"
      schema: main
      threads: 4
